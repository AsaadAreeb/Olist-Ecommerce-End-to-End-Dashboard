version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: customer_state
        data_tests: [not_null]

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['created','approved','invoiced','processing','shipped','delivered','canceled','unavailable']
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]
      - name: freight_value
        data_tests: [not_null]

  - name: stg_order_payments
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card','boleto','voucher','debit_card','not_defined']
      - name: payment_value
        data_tests: [not_null]

  - name: stg_order_reviews
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_category_translation
    columns:
      - name: product_category_name
        data_tests: [unique, not_null]